name: Browser tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One engine failing is the interesting case, and it is usually WebKit.
      # Cancelling the other run would hide whether the failure is specific to
      # it or common to both.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
            install: --with-deps chromium
            projects: --project=chromium
          # WebKit runs on macOS, and not only because the Linux build fights
          # the runner. We test WebKit because of Safari, and Linux WebKit is
          # the GTK port -- a different engine build from the one Safari ships.
          # Playwright's macOS WebKit is built on Apple's, so this is closer to
          # the thing DESIGN.md 2.3 actually names as the baseline.
          #
          # The emulated phone rides along here rather than claiming a third
          # runner: devices["iPhone 14"] is WebKit, so this machine already has
          # the browser it needs, and macOS minutes bill at ten times Linux.
          - browser: webkit
            os: macos-latest
            install: webkit
            projects: --project=webkit --project=mobile

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Install ${{ matrix.browser }}
        run: nix develop --command bun run browser:install ${{ matrix.install }}

      # Fails in a minute with the real launch error, instead of every test
      # timing out on newPage for ten minutes without saying why.
      - name: Check ${{ matrix.browser }} starts
        run: nix develop --command bun run browser:check ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }}
        run: nix develop --command bun run e2e ${{ matrix.projects }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
