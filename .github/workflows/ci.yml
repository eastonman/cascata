name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The fast gate: everything that needs no browser. Kept as one job rather than
# four, because each would pay the Nix setup again to save a second or two of
# work -- the split that actually buys wall-clock time is browsers, and that
# lives in e2e.yml running alongside this.
jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format and lint
        run: nix develop --command bun run check

      - name: Typecheck
        run: nix develop --command bun run typecheck

      - name: Unit tests
        run: nix develop --command bun run test

      # Also enforces the bundle size budget.
      - name: Build
        run: nix develop --command bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
